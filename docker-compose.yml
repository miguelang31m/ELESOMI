services:
  postgres:
    image: postgres:16
    container_name: aerolinea-pasajeros-db
    environment:
      POSTGRES_DB: aerolinea
      POSTGRES_USER: aerolinea
      POSTGRES_PASSWORD: aerolinea_dev
    ports:
      - "5433:5432"
    volumes:
      - aerolinea_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerolinea -d aerolinea"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  aerolinea_pgdata:
