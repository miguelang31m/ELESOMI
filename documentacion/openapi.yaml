openapi: 3.0.3
info:
  title: ELESOMI - API de Gestión de Pasajeros
  version: 1.0.0
  description: Contrato de integración académico. Sin autenticación; no exponer a Internet con datos reales.
servers:
  - url: http://localhost:8080/aerolinea-pasajeros/api
paths:
  /pasajeros:
    get:
      summary: Listar y buscar pasajeros activos
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: pagina, in: query, schema: {type: integer, default: 1, minimum: 1}}
        - {name: tamano, in: query, schema: {type: integer, default: 10, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Pasajero'}}
                  pagina: {type: integer}
                  tamano: {type: integer}
                  total: {type: integer, format: int64}
        '400': {$ref: '#/components/responses/Error'}
    post:
      summary: Registrar pasajero
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasajeroEntrada'}
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pasajero'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /pasajeros/verificar:
    get:
      summary: Verificar existencia por documento
      parameters:
        - {name: tipoDocumento, in: query, required: true, schema: {type: string, enum: [CC, CE, PAS, TI]}}
        - {name: numeroDocumento, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Verificación
          content:
            application/json:
              schema:
                type: object
                properties:
                  existe: {type: boolean}
                  id: {type: integer, format: int64, description: 'Solo si existe=true'}
        '400': {$ref: '#/components/responses/Error'}
  /pasajeros/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    get:
      summary: Consultar pasajero activo
      responses:
        '200':
          description: Pasajero
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pasajero'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      summary: Actualizar pasajero
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasajeroEntrada'}
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pasajero'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      summary: Desactivar pasajero
      responses:
        '204': {description: Desactivado}
        '404': {$ref: '#/components/responses/Error'}
components:
  responses:
    Error:
      description: Error de negocio
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    PasajeroEntrada:
      type: object
      required: [nombres, apellidos, tipoDocumento, numeroDocumento, fechaNacimiento]
      properties:
        nombres: {type: string, minLength: 2, maxLength: 80}
        apellidos: {type: string, minLength: 2, maxLength: 80}
        tipoDocumento: {type: string, enum: [CC, CE, PAS, TI]}
        numeroDocumento: {type: string, minLength: 4, maxLength: 25}
        fechaNacimiento: {type: string, format: date}
        correo: {type: string, format: email}
        telefono: {type: string}
        nacionalidad: {type: string}
    Pasajero:
      allOf:
        - {$ref: '#/components/schemas/PasajeroEntrada'}
        - type: object
          properties:
            id: {type: integer, format: int64}
            activo: {type: boolean}
    Error:
      type: object
      properties:
        codigo: {type: string}
        mensaje: {type: string}
